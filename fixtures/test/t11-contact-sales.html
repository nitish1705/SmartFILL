<!doctype html><html><head><title>Contact Sales</title></head><body>
<h2>Contact Sales</h2>
<form>
  <p><label for="n">Full name</label> <input id="n" name="n"></p>
  <p><label for="we">Work email</label> <input id="we" name="we"></p>
  <p><label for="cn">Company name</label> <input id="cn" name="cn"></p>

</form></body></html>

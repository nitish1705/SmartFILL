<!doctype html><html><head><title>Library Membership</title></head><body>
<h2>Library Membership</h2>
<form>
  <p><label for="ti">Your title</label> <select id="ti" name="ti"><option value="">Select</option><option value="mr">Mr.</option><option value="ms">Ms.</option><option value="dr">Dr.</option></select></p>
  <p><label for="fn">Forename</label> <input id="fn" name="fn"></p>
  <p><label for="sn">Surname</label> <input id="sn" name="sn"></p>
  <p><label for="em">E-mail</label> <input id="em" name="em"></p>
  <p><label for="tl">Telephone</label> <input id="tl" name="tl"></p>
  <p><label for="a1">Address line 1</label> <input id="a1" name="a1"></p>
  <p><label for="a2">Address line 2</label> <input id="a2" name="a2"></p>
  <p><label for="tw">Town/City</label> <input id="tw" name="tw"></p>
  <p><label for="pc">Postcode</label> <input id="pc" name="pc"></p>
  <p><label for="co">Country</label> <select id="co" name="co"><option value="">Select</option><option value="india">India</option><option value="unitedstates">United States</option><option value="germany">Germany</option></select></p>
  <button type="submit">Join</button>
</form></body></html>

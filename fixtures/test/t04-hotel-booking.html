<!doctype html><html><head><title>Hotel Booking</title></head><body>
<h2>Hotel Booking</h2>
<form>
  <p><label for="g">Guest name</label> <input id="g" name="g"></p>
  <p><label for="e">Email</label> <input id="e" name="e"></p>
  <p><label for="m">Mobile phone</label> <input id="m" name="m"></p>
  <p><label for="ar">Arrival date</label> <input id="ar" name="ar" type="date"></p>
  <p><label for="ni">Number of nights</label> <input id="ni" name="ni"></p>
  <p><label for="sp">Special requests</label> <textarea id="sp" name="sp"></textarea></p>
  <p><label for="co">Company</label> <input id="co" name="co"></p>
  <button type="submit">Book now</button>
</form></body></html>

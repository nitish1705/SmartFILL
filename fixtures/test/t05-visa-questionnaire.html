<!doctype html><html><head><title>Student Visa Questionnaire</title></head><body>
<h2>Student Visa Questionnaire</h2>
<form>
<table>
  <tr><td>Given names</td><td><input id="gn" name="gn"></td></tr>
  <tr><td>Family name</td><td><input id="fn" name="fn"></td></tr>
  <tr><td>Date of birth</td><td><input id="dob" name="dob" type="date"></td></tr>
  <tr><td>Passport no.</td><td><input id="pp" name="pp"></td></tr>
  <tr><td>Home address</td><td><input id="ha" name="ha"></td></tr>
  <tr><td>City</td><td><input id="ct" name="ct"></td></tr>
  <tr><td>Country of residence</td><td><select id="cr" name="cr"><option value="">Select</option><option value="india">India</option><option value="unitedstates">United States</option><option value="germany">Germany</option></select></td></tr>
  <tr><td>Phone number</td><td><input id="ph" name="ph"></td></tr>
</table>
  <button type="submit">Continue</button>
</form></body></html>

<!doctype html><html><head><title>Marathon Registration</title></head><body>
<h2>Marathon Registration</h2>
<form>
  <p><label for="n">Runner's full name</label> <input id="n" name="n"></p>
  <p><label for="e">Email address</label> <input id="e" name="e"></p>
  <p><label for="p">Contact number</label> <input id="p" name="p"></p>
  <p><label for="c">City of residence</label> <input id="c" name="c"></p>
  <p><label for="s">State</label> <input id="s" name="s"></p>
  <p><label for="z">Postal code</label> <input id="z" name="z"></p>
  <p><label for="en">Emergency contact name</label> <input id="en" name="en"></p>
  <p><label for="ep">Emergency contact phone</label> <input id="ep" name="ep" type="tel"></p>
  <p><label for="ts">T-shirt size</label> <input id="ts" name="ts"></p>
  <button type="submit">Register</button>
</form></body></html>

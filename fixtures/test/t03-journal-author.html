<!doctype html><html><head><title>Journal Author Registration</title></head><body>
<h2>Journal Author Registration</h2>
<form>
  <p><label>First (given) name <input id="f" name="f"></label></p>
  <p><label>Last (family) name <input id="l" name="l"></label></p>
  <p><label>Email <input id="m" name="m"></label></p>
  <p><label>Institution/Affiliation <input id="i" name="i"></label></p>
  <p><label>Country <select id="c" name="c"><option value="">Select</option><option value="india">India</option><option value="unitedstates">United States</option><option value="germany">Germany</option></select></label></p>
  <p><label>ORCID iD <input id="o" name="o"></label></p>
  <p><label>Department <input id="d" name="d"></label></p>
  <p><label>Position/Title <input id="po" name="po"></label></p>
  <p><label>Biography <textarea id="b" name="b"></textarea></label></p>
  <button type="submit">Create account</button>
</form></body></html>

<!doctype html><html><head><title>Job Portal</title></head><body>
<h2>Job Portal</h2>
<form>
  <p><label for="f">Applicant first name</label> <input id="f" name="f"></p>
  <p><label for="l">Applicant last name</label> <input id="l" name="l"></p>
  <p><label for="m">Mobile</label> <input id="m" name="m"></p>
  <p><label for="e">Email ID</label> <input id="e" name="e"></p>
  <p><label for="ce">Current employer</label> <input id="ce" name="ce"></p>
  <p><label for="jt">Job title</label> <input id="jt" name="jt"></p>
  <p><label for="ctc">Expected CTC</label> <input id="ctc" name="ctc"></p>
  <p><label for="np">Notice period</label> <input id="np" name="np"></p>
  <p><label for="li">LinkedIn profile</label> <input id="li" name="li"></p>
  <button type="submit">Apply</button>
</form></body></html>

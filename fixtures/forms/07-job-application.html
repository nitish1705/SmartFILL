<!doctype html><html><head><title>Apply - Research Engineer</title></head><body>
<h1>Apply for this job</h1>
<form>
  <label for="a">Full Name</label><input id="a" name="full_name">
  <label for="b">Email</label><input id="b" name="email" type="email">
  <label for="c">Phone</label><input id="c" name="phone" type="tel">
  <label for="d">Current Company</label><input id="d" name="company">
  <label for="e">Current Position</label><input id="e" name="position">
  <label for="f">LinkedIn URL</label><input id="f" name="linkedin" type="url">
  <label for="g">Cover letter</label><textarea id="g" name="cover"></textarea>
  <label for="h">Create password</label><input id="h" name="pwd" type="password">
  <label for="i">Salary expectation</label><input id="i" name="salary">
  <label for="j">Resume</label><input id="j" name="resume" type="file">
</form></body></html>

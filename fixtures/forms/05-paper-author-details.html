<!doctype html><html><head><title>Paper Submission - Step 2: Authors</title></head><body>
<h2>Author Information</h2>
<form>
  <label for="a">Author Name</label><input id="a" name="author_name"><br>
  <label for="b">Author Email</label><input id="b" name="author_email"><br>
  <label for="c">Affiliation / Institution</label><input id="c" name="author_aff"><br>
  <label for="d">Department/Division</label><input id="d" name="author_dept"><br>
  <label for="e">Country/Region</label><select id="e" name="author_country"><option value="">Choose</option><option>India</option><option>United States</option></select><br>
  <label for="f">ORCID</label><input id="f" name="author_orcid"><br>
  <label for="g">Research interests</label><textarea id="g" name="interests"></textarea><br>
  <label for="h">Biography</label><textarea id="h" name="bio"></textarea><br>
  <label><input type="checkbox" name="corresponding"> Corresponding author</label>
</form></body></html>

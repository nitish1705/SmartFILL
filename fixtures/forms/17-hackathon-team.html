<!doctype html><html><head><title>Hackathon Team Registration</title></head><body>
<h2>Hackathon Team Registration</h2>
<form>
  <p><label for="tn">Team name</label> <input id="tn" name="tn"></p>
  <p><label for="tl">Team leader name</label> <input id="tl" name="tl"></p>
  <p><label for="tle">Team leader email</label> <input id="tle" name="tle"></p>
  <p><label for="gh">GitHub username</label> <input id="gh" name="gh"></p>
  <p><label for="ph">Phone</label> <input id="ph" name="ph"></p>
  <p><label for="ct">City</label> <input id="ct" name="ct"></p>
  <p><label for="col">College</label> <input id="col" name="col"></p>
  <p><label for="tsh">T-shirt size</label> <input id="tsh" name="tsh"></p>
  <button type="submit">Register</button>
</form></body></html>

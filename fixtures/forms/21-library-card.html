<!doctype html><html><head><title>Library Card</title></head><body>
<h2>Library Card</h2>
<form>
<table>
  <tr><td>Card holder name</td><td><input id="ch" name="ch"></td></tr>
  <tr><td>Date of birth</td><td><input id="dob" name="dob" type="date"></td></tr>
  <tr><td>Home phone</td><td><input id="hp" name="hp"></td></tr>
  <tr><td>Email</td><td><input id="em" name="em"></td></tr>
  <tr><td>Home address</td><td><input id="ha" name="ha"></td></tr>
  <tr><td>Occupation / title</td><td><input id="oc" name="oc"></td></tr>
  <tr><td>Library branch</td><td><input id="br" name="br"></td></tr>
</table>
  <button type="submit">Apply</button>
</form></body></html>

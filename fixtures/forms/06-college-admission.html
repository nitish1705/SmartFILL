<!doctype html><html><head><title>Admission Form 2026</title></head><body>
<h2>Personal Details</h2>
<form>
  <label for="a">Candidate's Full Name</label><input id="a" name="cand_name"><br>
  <label for="b">Father's Name</label><input id="b" name="father_name"><br>
  <label for="c">Date of Birth</label><input id="c" name="dob" type="date"><br>
  <label for="d">Gender</label><select id="d" name="gender"><option value="">Select</option><option>Male</option><option>Female</option></select><br>
  <label for="e">Permanent Address</label><textarea id="e" name="perm_addr"></textarea><br>
  <label for="f">City</label><input id="f" name="city"><br>
  <label for="g">State</label><select id="g" name="state"><option value="">Select</option><option>Karnataka</option><option>Kerala</option></select><br>
  <label for="h">PIN Code</label><input id="h" name="pin"><br>
  <label for="i">Highest Qualification</label><input id="i" name="qual"><br>
  <label for="j">Aadhaar Number</label><input id="j" name="aadhaar"><br>
  <label for="k">Passport number</label><input id="k" name="passport"><br>
  <label for="l">Mother's Mobile</label><input id="l" name="mother_mobile" type="tel"><br>
</form></body></html>

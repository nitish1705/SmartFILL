<!doctype html><html><head><title>Summer School Application</title></head><body>
<h2>Summer School Application</h2>
<form>
  <p><label for="uni">Which university are you studying at?</label> <input id="uni" name="uni"></p>
  <p><label for="dept">Your department or school</label> <input id="dept" name="dept"></p>
  <p><label for="prog">Programme you are enrolled in</label> <input id="prog" name="prog"></p>
  <p><label for="ctry">Where are you based (country)?</label> <select id="ctry" name="ctry"><option value="">Select</option><option value="india">India</option><option value="unitedstates">United States</option><option value="germany">Germany</option></select></p>
  <p><label for="town">Town or city you live in</label> <input id="town" name="town"></p>
  <p><label for="wa">WhatsApp / mobile contact</label> <input id="wa" name="wa"></p>
  <p><label for="mail">Primary email for correspondence</label> <input id="mail" name="mail"></p>
  <p><label for="motiv">Motivation statement</label> <textarea id="motiv" name="motiv"></textarea></p>
  <p><label for="ref">Referral code</label> <input id="ref" name="ref"></p>
  <button type="submit">Apply</button>
</form></body></html>

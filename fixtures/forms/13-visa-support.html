<!doctype html><html><head><title>Visa Support Request</title></head><body>
<h2>Visa Support Request</h2>
<form>
<table>
  <tr><td>Surname as on passport</td><td><input id="sn" name="sn"></td></tr>
  <tr><td>First / given names</td><td><input id="gn" name="gn"></td></tr>
  <tr><td>Nationality</td><td><input id="nat" name="nat"></td></tr>
  <tr><td>Country of residence</td><td><select id="res" name="res"><option value="">Select</option><option value="india">India</option><option value="unitedstates">United States</option><option value="germany">Germany</option></select></td></tr>
  <tr><td>Address for the invitation letter</td><td><input id="addr" name="addr"></td></tr>
  <tr><td>Passport number</td><td><input id="pp" name="pp"></td></tr>
  <tr><td>Date of arrival</td><td><input id="arr" name="arr" type="date"></td></tr>
  <tr><td>Embassy city</td><td><input id="emb" name="emb"></td></tr>
</table>
  <button type="submit">Request letter</button>
</form></body></html>

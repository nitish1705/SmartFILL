<!doctype html><html><head><title>Student Membership</title></head><body>
<h2>Student Membership</h2>
<form>
  <p><label for="sal">Title</label> <select id="sal" name="sal"><option value="">Select</option><option value="mr">Mr.</option><option value="ms">Ms.</option><option value="dr">Dr.</option></select></p>
  <p><label for="f">First name</label> <input id="f" name="f"></p>
  <p><label for="l">Last name</label> <input id="l" name="l"></p>
  <p><label for="se">Student email</label> <input id="se" name="se"></p>
  <p><label for="deg">Degree sought</label> <input id="deg" name="deg"></p>
  <p><label for="yr">Year</label> <input id="yr" name="yr"></p>
  <p><label for="grad">Graduation year</label> <input id="grad" name="grad"></p>
  <p><label for="ad">Home address (line 1)</label> <input id="ad" name="ad"></p>
  <p><label for="zip">Postal / ZIP code</label> <input id="zip" name="zip"></p>
  <p><label for="st">State / Province</label> <input id="st" name="st"></p>
  <button type="submit">Join</button>
</form></body></html>

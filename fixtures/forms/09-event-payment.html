<!doctype html><html><head><title>Event tickets</title></head><body>
<h2>Attendee Details</h2>
<form>
  <label for="a">First name</label><input id="a" name="att_first">
  <label for="b">Last name</label><input id="b" name="att_last">
  <label for="c">Email</label><input id="c" name="att_email" type="email">
  <h2>Payment Details</h2>
  <label for="d">Card number</label><input id="d" name="cardno">
  <label for="e">Expiry</label><input id="e" name="exp">
  <label for="f">CVV</label><input id="f" name="cvv">
  <label for="g">Name on card</label><input id="g" name="cardname">
  <h2>Billing Address</h2>
  <label for="h">Address</label><input id="h" name="bill_addr">
  <label for="i">City</label><input id="i" name="bill_city">
  <label for="j">Zip</label><input id="j" name="bill_zip">
</form></body></html>

<!doctype html><html><head><title>Delivery Address</title></head><body>
<h2>Delivery Address</h2>
<form>
  <p><label for="st1">Street address</label> <input id="st1" name="st1"></p>
  <p><label for="st2">Apartment, suite, etc.</label> <input id="st2" name="st2"></p>
  <p><label for="cty">Town / City</label> <input id="cty" name="cty"></p>
  <p><label for="cn">County / State</label> <input id="cn" name="cn"></p>
  <p><label for="pc">Post code</label> <input id="pc" name="pc"></p>
  <p><label for="ctr">Country</label> <select id="ctr" name="ctr"><option value="">Select</option><option value="india">India</option><option value="unitedstates">United States</option><option value="germany">Germany</option></select></p>
  <button type="submit">Save</button>
</form></body></html>

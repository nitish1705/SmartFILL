<!doctype html><html><head><title>ICML Workshop Registration</title></head><body>
<h1>Workshop Registration</h1>
<form>
  <label for="fn">First Name *</label><input id="fn" name="first_name" required><br>
  <label for="ln">Last Name</label><input id="ln" name="last_name"><br>
  <label for="em">Email Address</label><input id="em" name="email" type="email"><br>
  <label for="mo">Mobile Number</label><input id="mo" name="mobile" type="tel"><br>
  <label for="in">Institution</label><input id="in" name="institution"><br>
  <label for="co">Country</label>
  <select id="co" name="country"><option value="">Select country</option><option value="US">United States</option><option value="IN">India</option><option value="DE">Germany</option></select><br>
  <label for="or">ORCID iD</label><input id="or" name="orcid"><br>
  <label for="ts">T-shirt size</label><select id="ts" name="tshirt"><option value="">--</option><option>S</option><option>M</option><option>L</option></select><br>
  <label for="di">Dietary preferences</label><input id="di" name="diet"><br>
  <button type="submit">Register</button>
</form></body></html>

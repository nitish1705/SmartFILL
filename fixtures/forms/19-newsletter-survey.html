<!doctype html><html><head><title>Reader Survey</title></head><body>
<h2>Reader Survey</h2>
<form>
  <p><label for="fn">Your first name</label> <input id="fn" name="fn"></p>
  <p><label for="sn">Surname</label> <input id="sn" name="sn"></p>
  <p><label for="em">Email</label> <input id="em" name="em"></p>
  <p><label for="co">Country</label> <select id="co" name="co"><option value="">Select</option><option value="india">India</option><option value="unitedstates">United States</option><option value="germany">Germany</option></select></p>
  <p><label for="occ">Occupation</label> <input id="occ" name="occ"></p>
  <p><label for="ind">Industry</label> <input id="ind" name="ind"></p>
  <p><label for="yrs">Years of experience</label> <input id="yrs" name="yrs"></p>
  <p><label for="cm">Comments</label> <textarea id="cm" name="cm"></textarea></p>
  <button type="submit">Send</button>
</form></body></html>

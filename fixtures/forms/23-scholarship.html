<!doctype html><html><head><title>Scholarship Application</title></head><body>
<h2>Scholarship Application</h2>
<form>
  <p><label for="an">Applicant name</label> <input id="an" name="an"></p>
  <p><label for="ci">Current institution</label> <input id="ci" name="ci"></p>
  <p><label for="co">Course</label> <input id="co" name="co"></p>
  <p><label for="ra">Residential address</label> <input id="ra" name="ra"></p>
  <p><label for="mn">Mobile no.</label> <input id="mn" name="mn"></p>
  <p><label for="pg">Parent/guardian mobile</label> <input id="pg" name="pg"></p>
  <p><label for="pe">Parent email</label> <input id="pe" name="pe"></p>
  <p><label for="inc">Annual family income</label> <input id="inc" name="inc"></p>
  <button type="submit">Apply</button>
</form></body></html>

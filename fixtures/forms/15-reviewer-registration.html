<!doctype html><html><head><title>Journal Reviewer Registration</title></head><body>
<h2>Journal Reviewer Registration</h2>
<form>
  <p><label>Full name <input id="fn" name="fn"></label></p>
  <p><label>Institutional affiliation <input id="aff" name="aff"></label></p>
  <p><label>Research area(s) <textarea id="area" name="area"></textarea></label></p>
  <p><label>ORCID <input id="orc" name="orc"></label></p>
  <p><label>Email <input id="em" name="em"></label></p>
  <p><label>Preferred name <input id="pref" name="pref"></label></p>
  <p><label>Expertise keywords <input id="kw" name="kw"></label></p>
  <button type="submit">Register</button>
</form></body></html>

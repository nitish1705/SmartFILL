<!doctype html><html><head><title>Quick RSVP</title></head><body>
<h2>Quick RSVP</h2>
<form>
  <p><input id="n" name="n" placeholder="Your full name"></p>
  <p><input id="e" name="e" placeholder="Best email to reach you"></p>
  <p><input id="m" name="m" placeholder="Mobile (with country code)"></p>
  <p><input id="i" name="i" placeholder="Which institute are you from?"></p>
  <p><input id="g" name="g" placeholder="Number of guests"></p>
  <p><input id="d" name="d" placeholder="Dietary needs"></p>
  <button type="submit">RSVP</button>
</form></body></html>
